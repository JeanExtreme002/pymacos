name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  # Run the whole suite, live tests included, on the commit being released:
  # nothing reaches PyPI from a commit whose tests fail.
  test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Unit tests
      run: pytest tests/unit -v
    - name: Live tests
      # Retried once, as on pull requests: the runner is shared. The unit tests never are.
      run: pytest tests/live -v --reruns 1 --reruns-delay 5

  # The publish action only runs on Linux, hence a separate job.
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    # A PyPI version can never be uploaded twice, so refuse to publish when the
    # release tag and the package version disagree (e.g. tag v1.1.0 while
    # macos/__init__.py still says 1.0.0).
    - name: Check the tag matches the package version
      run: |
        version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('macos/__init__.py').read()).group(1))")
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "::error::Release tag $GITHUB_REF_NAME does not match __version__ $version"
          exit 1
        fi

    - name: Install build tools
      run: python -m pip install --upgrade pip build

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
