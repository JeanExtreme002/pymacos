name: Build

# The package as PyPI gets it: build the wheel and the sdist, check them, then
# install the wheel in a clean environment and test it. The other workflows use
# an editable install, which reads the source folder directly, so a file left
# out of the package would pass there and only break for users.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
      with:
        python-version: '3.12'
    - name: Install build tools
      run: python -m pip install --upgrade pip build twine
    - name: Build the sdist, and the wheel from it
      run: python -m build
    - name: Check the metadata PyPI reads
      run: twine check --strict dist/*
    - name: Check what the wheel holds
      # Every module of the source, the py.typed marker for type checkers, the
      # version of macos/__init__.py, and nothing else (no tests, no docs).
      run: |
        python - <<'EOF'
        import glob, pathlib, re, zipfile

        wheel = glob.glob("dist/*.whl")
        assert len(wheel) == 1, wheel
        names = set(zipfile.ZipFile(wheel[0]).namelist())
        version = re.search(r'__version__ = "(.+?)"', pathlib.Path("macos/__init__.py").read_text()).group(1)
        assert wheel[0].endswith("pymacos-{}-py3-none-any.whl".format(version)), wheel[0]
        modules = {str(path) for path in pathlib.Path("macos").rglob("*.py")}
        assert modules <= names, "left out of the wheel: {}".format(sorted(modules - names))
        assert "macos/py.typed" in names, "py.typed is missing"
        extra = sorted(name for name in names if not name.startswith(("macos/", "pymacos-")))
        assert not extra, "unexpected files in the wheel: {}".format(extra)
        print("{}: {} files, {} modules".format(wheel[0], len(names), len(modules)))
        EOF
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
      with:
        name: dist
        path: dist/

  # The wheel installed for real, on macOS, with the source folder gone: the
  # tests can only import the installed package.
  install:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
      with:
        name: dist
        path: dist/
    - name: Install the wheel in a clean environment
      run: |
        python -m venv /tmp/env
        /tmp/env/bin/python -m pip install --upgrade pip pytest
        /tmp/env/bin/python -m pip install dist/*.whl
        rm -rf macos
    - name: Check it's the installed package that's imported
      run: |
        /tmp/env/bin/python -c "import macos, sys; print(macos.__version__, macos.__file__); sys.exit('site-packages' not in macos.__file__)"
    - name: Test the installed package
      run: /tmp/env/bin/python -m pytest tests/unit -q
