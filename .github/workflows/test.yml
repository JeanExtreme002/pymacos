name: Test

# The test suite, on macOS across Python versions and on Linux. The jobs' names
# (test-macos (3.x), test-linux) are required checks on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The live tests talk to the real system (NSWorkspace, the Keychain, the
  # pasteboard, screencapture), so the Python-version sweep runs on macOS.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Unit tests
      # --cov-fail-under is the real coverage gate: deterministic and
      # independent of any external service. Codecov (below) only reports.
      # It measures the unit tests alone: which live tests run depends on the
      # runner (no battery, no Bluetooth, no network...), so a gate on the
      # whole suite could fail for reasons unrelated to the change.
      # The XML is for Codecov even when this step fails and the live tests are
      # skipped; when they run, they rewrite it with both suites' coverage.
      run: pytest tests/unit -v --cov=macos --cov-report=term --cov-report=xml --cov-fail-under=60
    - name: Live tests
      # They talk to a real, shared runner, where speech, launchd and the
      # network are sometimes slow: a failure is retried before it counts.
      # Their coverage is added to the unit tests' for the Codecov report.
      run: pytest tests/live -v --reruns 1 --reruns-delay 5 --cov=macos --cov-append --cov-report=term --cov-report=xml
    - name: Upload coverage to Codecov
      # Informational only (see codecov.yml): a flaky upload never fails the
      # job. Runs even when tests fail, so partial coverage stays visible.
      if: always()
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: macOS-py${{ matrix.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  # The package must import anywhere and fail with NotSupportedError, so the
  # unit tests also run on Linux (the live ones skip themselves there).
  test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Test with pytest
      # No gate here: outside macOS only the platform guards run, which is
      # what this job checks. The upload shows that code path in Codecov.
      run: pytest tests -v --cov=macos --cov-report=term --cov-report=xml
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: Linux-py3.12
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
