name: Test

# The test suite, on macOS across Python versions and on Linux, plus an Intel
# Mac and the previous macOS. The jobs' names (test-macos (3.x), test-linux)
# are required checks on main; test-macos-compat isn't.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The live tests talk to the real system (NSWorkspace, the Keychain, the
  # pasteboard, screencapture), so the Python-version sweep runs on macOS.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Unit tests
      # --cov-fail-under is the real coverage gate: deterministic and
      # independent of any external service. Codecov (below) only reports.
      # It measures the unit tests alone, on every Python: which live tests run
      # depends on the runner (no battery, no Bluetooth, no network...). The
      # whole suite is gated only once, below, well under what it reaches.
      # The XML is for Codecov even when this step fails and the live tests are
      # skipped; when they run, they rewrite it with both suites' coverage.
      run: pytest tests/unit -v --cov=macos --cov-report=term --cov-report=xml --cov-fail-under=70
    - name: Live tests
      # They talk to a real, shared runner, where speech, launchd and the
      # network are sometimes slow: a failure is retried before it counts.
      # Their coverage is added to the unit tests' for the Codecov report.
      # GitHub's arm64 runners have Accessibility and Screen Recording granted:
      # a test skipped for a missing permission fails here, so an image that
      # loses them can't quietly turn part of the suite into skips. On one
      # Python, both suites together are gated too (they reach 92% there).
      env:
        PYMACOS_REQUIRE_PERMISSIONS: "1"
      run: >-
        pytest tests/live -v -rs --reruns 1 --reruns-delay 5
        --cov=macos --cov-append --cov-report=term --cov-report=xml
        ${{ matrix.python-version == '3.12' && '--cov-fail-under=88' || '' }}
    - name: Upload coverage to Codecov
      # Informational only (see codecov.yml): a flaky upload never fails the
      # job. Runs even when tests fail, so partial coverage stays visible.
      if: always()
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
      with:
        files: ./coverage.xml
        flags: macOS-py${{ matrix.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  # The other Macs the package runs on: an Intel one, where struct returns take
  # another path into the Objective-C runtime (objc_msgSend_stret), and the
  # previous macOS. Which permissions these images grant isn't known, so a test
  # missing one skips here. Not a required check, so it can be added or
  # dropped as GitHub's images come and go.
  test-macos-compat:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Unit tests
      run: pytest tests/unit -v
    - name: Live tests
      run: pytest tests/live -v -rs --reruns 1 --reruns-delay 5

  # The package must import anywhere and fail with NotSupportedError, so the
  # unit tests also run on Linux (the live ones skip themselves there).
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Test with pytest
      # No gate here: outside macOS only the platform guards run, which is
      # what this job checks. The upload shows that code path in Codecov.
      run: pytest tests -v --cov=macos --cov-report=term --cov-report=xml
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
      with:
        files: ./coverage.xml
        flags: Linux-py3.12
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
